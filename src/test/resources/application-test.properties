# Test Configuration
spring.application.name=bk-inventory-test
server.port=0

# Product Service Configuration for tests
product.service.url=http://localhost:8080/api/v1/products
product.service.api-key=test-api-key
product.service.timeout-seconds=10
product.service.retry.max-attempts=3
product.service.retry.initial-delay-millis=500
product.service.retry.max-delay-millis=2000
product.service.retry.multiplier=2.0

# Disable JPA for tests
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver

